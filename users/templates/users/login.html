<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход в систему</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        .error {
            color: red;
            border: 1px solid red;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
        }
        label {
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 8px;
            margin: 5px 0 15px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #0066cc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0052a3;
        }
        a {
            color: #0066cc;
        }
    </style>
</head>
<body>
    <h1>Вход в систему</h1>

    {% if form.errors %}
        <div class="error">
            <strong>Ошибка входа:</strong>
            {% for field, errors in form.errors.items %}
                {% for error in errors %}
                    <p>{{ error }}</p>
                {% endfor %}
            {% endfor %}
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="{{ form.email.id_for_label }}">Email:</label>
        {{ form.email }}

        <label for="{{ form.password.id_for_label }}">Пароль:</label>
        {{ form.password }}

        <button type="submit">Войти</button>
    </form>

    <p>Ещё нет аккаунта? <a href="{% url 'users:register' %}">Зарегистрироваться</a></p>
</body>
</html>
